[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quetz-lang"
version = "0.2.0"
description = "A clean, lightweight, interpreted programming language in Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jalal Kouaki", email = "jalalkouaki@outlook.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers"
]

[project.urls]
Homepage = "https://github.com/jalalkouaki/quetz"
Repository = "https://github.com/jalalkouaki/quetz"

[project.scripts]
quetz = "quetz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quetz*"]
